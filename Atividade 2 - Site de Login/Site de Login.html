<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Login Institucional</title>
</head>

<body>

    <h1>Instituição Escolar</h1>
    <h2>Área de Login</h2>
    <form>
        <p>Selecione seu perfil:</p>
        <input type="radio" name="perfil" value="aluno">
        <label>Aluno</label>
        <input type="radio" name="perfil" value="professor">
        <label>Professor</label>
        <br><br>
        <label>Email:</label>
        <br>
        <input type="email" placeholder="Digite seu email">
        <br><br>
        <label>Senha:</label>
        <br>
        <input type="password" placeholder="Digite sua senha">
        <br><br>
        <button type="submit">Entrar</button>
        <button type="reset">Limpar</button>
    </form>

</body>
</html>
